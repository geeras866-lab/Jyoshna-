name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -oq "$z"; done
          ls
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd Jyoshna-App && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jyoshna-APK
          path: Jyoshna-App/app/build/outputs/apk/debug/app-debug.apk
